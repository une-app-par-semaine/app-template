# Mises à jour automatiques des dépendances.
# cooldown : attendre 7 jours avant de proposer une nouvelle version,
# le temps qu'un paquet piégé ou instable soit repéré et retiré.
# Décommenter le bloc correspondant à la stack de l'app.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

