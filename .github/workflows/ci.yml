# Tests à chaque push et pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ajouter ici la mise en place de la stack (setup-node, setup-python…).
      - name: Lancer les tests
        run: ./scripts/test.sh
